      owl_type: ObjectProperty
  has_goals:
    description: Links an Organism to their time-bound, measurable goals that work toward their visions.
    domain_of:
    - Organism
    range: Goal
    multivalued: true
    required: false
    slot_uri: lifeos:has_goals
    annotations:
      owl_type: ObjectProperty
  enacts_principle:
    description: Links a Behavior to the Principle(s) it concretely enacts or manifests. Direct relationship,
      not first-class qualified link (per C-SELF-4).
    domain_of:
    - Behavior
    range: Principle
    multivalued: true
    required: false
    slot_uri: lifeos:enacts_principle
    annotations:
      owl_type: ObjectProperty
  implements_goal:
    description: Links a Behavior to the Goal(s) it works toward. Direct relationship, not first-class
      qualified link (per C-SELF-4).
    domain_of:
    - Behavior
    range: Goal
    multivalued: true
    required: false
    slot_uri: lifeos:implements_goal
    annotations:
      owl_type: ObjectProperty
  aligned_with_vision:
    description: Links a Goal to one or more Visions it explicitly advances toward and works toward.
    domain_of:
    - Goal
    range: Vision
    multivalued: true
    required: false
    slot_uri: lifeos:aligned_with_vision
    annotations:
      owl_type: ObjectProperty
  has_deltas:
    description: Links a Goal to the specific Outcomes and Actions (Deltas) that operationalize and implement
      the goal.
    domain_of:
    - Goal
    range: Delta
    multivalued: true
    required: false
    slot_uri: lifeos:has_deltas
    annotations:
      owl_type: ObjectProperty
  start_date:
    description: When the effort commitment began
    range: date
  target_date:
    description: Horizon date for the effort (less binding than due_date)
    range: date
  parent_effort:
    description: Parent effort for nested/hierarchical efforts
    range: Effort
  activity_type:
    description: Runtime discriminator for activity type; determines semantics and behavior
    range: string
    designates_type: true
    required: true
  due_date:
    description: Target completion date for the activity
    range: date
  parent_activity:
    description: Parent activity for hierarchical nesting
    range: Activity
  relationship_type:
    description: Enumerated type of relationship (friend, colleague, mentor, family, romantic, acquaintance,
      professional, coach, collaborator). Working set; formal enum finalization deferred to Phase 2.
    range: RelationshipTypeEnum
    required: true
    multivalued: false
  role:
    slot_uri: lifeos:role
    range: string
    description: 'Semantic role in a qualified relationship. Examples: primary_subject, keyword_mention,
      background, evidence, reference, uses, produces.'
  provenance:
    slot_uri: prov:wasGeneratedBy
    range: string
    description: Provenance or explanation of how the relationship was determined (system-determined,
      human-curated, ml-classified, etc.)
  creator:
    slot_uri: schema:creator
    range: uriorcurie
    description: Structured reference to creator Agent/Person
  created_at:
    description: Timestamp when annotation was created
    range: datetime
    required: true
  uses_object:
    description: The Object that this Asset represents or actively uses. Establishes the primary link
      between Asset (possessive use relationship) and Object (the thing in the world).
    range: Object
    required: true
    multivalued: false
    designates_type: false
  has_usage:
    description: Free-text description of how this Asset is used or what role it plays in the organism's
      life or work (e.g., "daily coding," "backup storage," "transportation").
    range: string
    required: false
    multivalued: false
  has_age:
    description: 'Integer representing how long (in application-specific units: days, months, years) this
      Asset has been in use. Does not represent absolute age of the Object, but duration of use by the
      organism.'
    range: integer
    required: false
    multivalued: false
    minimum_value: 0
  contact_info:
    description: Contact information for a Person (email, phone, address, or structured contact details).
      Candidate slot; deferred for full schema formalization.
    range: string
    required: false
    multivalued: true
  involves_person:
    description: The Person(s) involved in this Relationship. Minimum one external Person; Organism reference
      implicitly assumed when queried from Organism context.
    range: Person
    required: true
    multivalued: true
    inlined: false
  since_date:
    description: Date when this Relationship began or was formally established.
    range: date
    required: false
    multivalued: false
  relationship_status:
    description: Current state of the Relationship in its lifecycle (active, dormant, ended, paused, evolving).
    range: RelationshipStatusEnum
    required: false
    multivalued: false
  context_or_meaning:
    description: Free-text description of the context, origin, or meaning of this Relationship (e.g.,
      "met at Python conference," "childhood friend," "former boss").
    range: string
    required: false
    multivalued: false
  member_list:
    description: List of Persons who are members of this Community.
    range: Person
    required: false
    multivalued: true
    inlined: false
  founded_date:
    description: Date when the Community was established or formed.
    range: date
    required: false
    multivalued: false
  community_purpose:
    description: The explicit purpose, mission, or shared goal of the Community.
    range: string
    required: false
    multivalued: false
  content_location:
    slot_uri: lifeos:contentLocation
    range: uri
    description: Object store URL or pointer to where resource content is actually stored (distinct from
      location, which is the canonical source).
  format:
    slot_uri: lifeos:format
    range: string
    description: File format as human-readable category (Markdown, PDF, HTML, JSON, GitHub, etc.). Distinct
      from media_type which uses MIME type.
  media_type:
    slot_uri: schema:mediaType
    range: string
    description: MIME type (text/plain, application/pdf, etc.)
  resource_type:
    slot_uri: lifeos:resourceType
    range: string
    description: 'Runtime discriminator for resource subtype. Values: Note, Document, Bookmark, Highlight,
      Collection, Catalog. Used to determine which subclass to instantiate.'
  updated_on:
    slot_uri: schema:dateModified
    range: datetime
    description: Last modification timestamp
  source_system:
    slot_uri: lifeos:sourceSystem
    range: string
    description: Original source application (Obsidian, Safari, Zotero, etc.)
  ingestion_method:
    slot_uri: lifeos:ingestionMethod
    range: string
    description: How resource was ingested (web_clipper, manual, import, API, crawl, etc.)
  ingestion_confidence:
    slot_uri: lifeos:ingestionConfidence
    range: double
    minimum_value: 0.0
    maximum_value: 1.0
    description: Confidence in metadata extraction during ingestion (0.0-1.0). Higher values indicate
      higher confidence in extracted metadata.
  last_sync:
    slot_uri: lifeos:lastSync
    range: datetime
    description: Timestamp of last synchronization attempt
  references_resource:
    slot_uri: lifeos:references
    range: Resource
    multivalued: true
    description: This resource cites, quotes, or references another resource. Inverse of is_referenced_by.
  is_referenced_by:
    slot_uri: lifeos:isReferencedBy
    range: Resource
    multivalued: true
    inverse: references_resource
    description: This resource is referenced by another resource. Inverse of references_resource.
  derives_from:
    slot_uri: lifeos:derivesFrom
    range: Resource
    multivalued: true
    description: This resource is synthesized from or built upon another resource. Inverse of is_source_for.
  is_source_for:
    slot_uri: lifeos:isSourceFor
    range: Resource
    multivalued: true
    inverse: derives_from
    description: This resource is a source for synthesis in another resource. Inverse of derives_from.
  elaborates:
    slot_uri: lifeos:elaborates
    range: Resource
    multivalued: true
    description: This resource provides more detail or development of another resource. Inverse of is_elaborated_by.
  is_elaborated_by:
    slot_uri: lifeos:isElaboratedBy
    range: Resource
    multivalued: true
    inverse: elaborates
    description: This resource is elaborated by another resource providing more detail. Inverse of elaborates.
  contradicts:
    slot_uri: lifeos:contradicts
    range: Resource
    multivalued: true
    description: This resource conflicts with or contradicts another resource. Inverse of is_contradicted_by.
  is_contradicted_by:
    slot_uri: lifeos:isContradictedBy
    range: Resource
    multivalued: true
    inverse: contradicts
    description: This resource is contradicted by another resource. Inverse of contradicts.
  supersedes:
    slot_uri: lifeos:supersedes
    range: Resource
    multivalued: true
    description: This resource replaces, updates, or makes obsolete another resource. Inverse of is_superseded_by.
  is_superseded_by:
    slot_uri: lifeos:isSupersededBy
    range: Resource
    multivalued: true
    inverse: supersedes
    description: This resource is superseded by another resource. Inverse of supersedes.
  relates_to:
    slot_uri: dcterms:relation
    range: Resource
    multivalued: true
    description: Generic relationship indicating resources are related but not classifiable under more
      specific relation types.
  relates_to_topic:
    slot_uri: lifeos:relatesToTopic
    range: Topic
    multivalued: true
    description: This resource is about, relates to, or is classified by one or more Topics. Typically
      used via ResourceTopicLink for rich metadata.
  has_use:
    slot_uri: lifeos:hasUse
    range: uriorcurie
    multivalued: true
    description: This resource is used by or supports one or more Activities in the Work domain. Typically
      used via ResourceActivityLink for qualified metadata.
  has_purpose:
    slot_uri: lifeos:hasPurpose
    range: uriorcurie
    description: The designated purpose or function of this resource. Typically a Purpose entity from
      Self/Work domain (definition deferred). At most one official purpose per resource.
  has_resources:
    slot_uri: dcterms:hasPart
    range: Resource
    multivalued: true
    description: Member resources in this collection or catalog. For Collection, typically untyped. For
      Catalog, typically via typed CatalogEntry mechanism.
  is_in_collection:
    slot_uri: dcterms:isPartOf
    range: Collection
    inverse: has_resources
    description: This resource is a member of a Collection.
  is_in_catalog:
    slot_uri: lifeos:isInCatalog
    range: Catalog
    description: This resource is cataloged in a Catalog.
  themes:
    slot_uri: dcat:themeTaxonomy
    range: TopicTaxonomy
    multivalued: true
    description: Knowledge organization systems (KOS) used to classify resources in this catalog. Typically
      SKOS ConceptSchemes or similar.
  is_in_repository:
    slot_uri: lifeos:isInRepository
    range: Repository
    description: The repository/system where this resource is stored.
  service_name:
    slot_uri: lifeos:serviceName
    range: string
    description: Application or service name (Obsidian, Safari, Zotero, Raindrop, GitHub, FileSystem,
      Heptabase, Readwise, etc.)
  repository_type:
    slot_uri: lifeos:repositoryType
    range: RepositoryTypeEnum
    description: System classification (local, cloud, hybrid, distributed, version_control)
  web_url:
    slot_uri: schema:url
    range: uri
    description: Public web interface URL if available (e.g., web UI for cloud service)
  has_source_resource:
    slot_uri: lifeos:hasSourceResource
    range: Resource
    description: The resource from which this highlight was extracted.
  source_passage_text:
    slot_uri: lifeos:sourcePassageText
    range: string
    description: The actual quoted text from the source resource.
  source_location:
    slot_uri: lifeos:sourceLocation
    range: string
    description: Optional location within source (page number, URL fragment, line range, timestamp, etc.)
  note_type:
    slot_uri: lifeos:noteType
    range: NoteTypeEnum
    description: Discrimination type for Note (Note, Log, Thought, Idea, Reference, Highlight)
  document_type:
    slot_uri: lifeos:documentType
    range: DocumentTypeEnum
    description: Functional document type (Document, Journal, List, Notebook, Logbook, Inventory, Landscape)
  favicon_url:
    slot_uri: lifeos:faviconUrl
    range: uri
    description: Favicon/icon URL for the referenced web page.
  source_resource:
    slot_uri: lifeos:sourceResource
    range: Resource
    description: The source resource in a qualified link.
  target_topic:
    slot_uri: lifeos:targetTopic
    range: Topic
    description: The target topic in a qualified link.
  target_activity:
    slot_uri: lifeos:targetActivity
    range: uriorcurie
    description: The target activity (Work domain) in a qualified link. Using CURIE for forward reference.
  uri:
    description: Explicit RDF IRI if different from id (optional)
    range: uriorcurie
  target:
    description: The resource, entity, or concept being annotated
    range: uriorcurie
    required: true
  annotation_type:
    description: Kind of assertion (topic_classification, entity_linking, summary, keyphrase, sentiment,
      concern_linking)
    range: AnnotationTypeEnum
    required: true
  value_concept:
    description: Concept value for topic_classification and concern_linking annotations
    range: uriorcurie
  value_entity:
    description: Entity value for entity_linking annotations
    range: uriorcurie
prefixes:
  lifeos: https://lifeos.org/ontology/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  dcterms: http://purl.org/dc/terms/
  skos: http://www.w3.org/2004/02/skos/core#
  foaf: http://xmlns.com/foaf/0.1/
  dbo: http://dbpedia.org/ontology/
  dcat: http://www.w3.org/ns/dcat#
  prov: http://www.w3.org/ns/prov#
enums:
  LifeDomainEnum:
    title: Life Business Ontology Domain Tags
    description: Controlled vocabulary for annotating which high-level domain an entity belongs to. Used
      as a machine-readable organizational hint and navigation aid, not as a runtime type system. Multiple
      domains can apply to a single entity conceptually, but primary domain is indicated here.
    permissible_values:
      ORGANISM_IDENTITY:
        title: Organism/Identity
        description: Self-identity and identity roles (Self domain). Entities describing who I am, roles
          I occupy, and how I see myself.
      ORGANISM_PURPOSE:
        title: Organism/Purpose
        description: Values, principles, and purpose (Self domain). Entities describing what I believe
          in, principles that guide me, and my overall vision.
      ORGANISM_OPERATIONS:
        title: Organism/Operations
        description: Behaviors, methods, and practices (Self domain). Entities describing how I act, techniques
          I use, and patterns I follow.
      ORGANISM_EVOLUTION:
        title: Organism/Evolution
        description: Goals, deltas, and transformations (Self domain). Entities describing where I'm headed,
          changes I want to make, and desired outcomes.
      WORK:
        title: Work Domain
        description: Work and activities (Work domain). Entities describing efforts, activities, and concerns
          that organize my work.
      WORLD:
        title: World Domain
        description: 'Objects and assets (World domain). Entities describing things external to me: people,
          objects, assets, and communities.'
      INFORMATION:
        title: Information Domain
        description: Topics and knowledge organization (Information domain). Entities describing conceptual
          domains, taxonomies, and knowledge classification.
      KNOWLEDGE_MANAGEMENT:
        title: Knowledge Management Domain
        description: 'Resources, documents, bookmarks, collections (Knowledge Management domain). Entities
          describing artifacts: documents, notes, links, and collections.'
      FACTS:
        title: Facts Domain
        description: Problems, risks, conditions, capabilities (Facts domain). Entities describing factual
          challenges, hazards, and competencies.
      CONCERNS:
        title: Concerns Domain
        description: Active focus areas and concerns (Concerns domain). Entities describing what I'm currently
          paying attention to.
      ANNOTATIONS:
        title: Annotations Domain
        description: Annotations and metadata extensions (Annotations domain). Entities describing provisional
          or confirmed assertions about other entities.
  SyncStatusEnum:
    title: Sync Status
    description: Synchronization state across multiple repositories
    permissible_values:
      in_sync:
        description: Resource is synchronized across systems
      pending_sync:
        description: Pending synchronization
      deleted_in_source:
        description: Deleted in source system but preserved locally
      deferred:
        description: Sync deferred for later processing
  ConcernTypeEnum:
    description: Runtime discriminator for concern types. Allows runtime polymorphism without creating
      explicit class hierarchy.
    permissible_values:
      project:
        description: A concrete project with defined scope, resources, timeline, and outcome. Distinct
          from Work::Project (execution structure).
      goal:
        description: A target state or objective with measurable progression. Distinct from Self::Goal
          (enduring aspiration).
      area:
        description: A broad area of life (Health, Career, Family, Finance, etc.). Distinct from Self::Role
          (identity-based).
      routine:
        description: A recurring practice, habit, or regular commitment. Distinct from Self::Habit (stable
          behavioral pattern).
      learning:
        description: A learning track, course, or skill development journey. Distinct from Self::Capability
          (the outcome).
      log:
        description: An ongoing log, journal, or time-series tracking mechanism. Distinct from individual
          log entries (those are Resources).
      custom:
        description: User-defined concern type not covered by standard categories.
  ConcernStatusEnum:
    description: Simple three-state lifecycle for concerns in the focus layer. Simpler than Effort (6
      states) or Activity (5 states) because Concerns are about focus, not execution detail.
    permissible_values:
      active:
        description: Concern is actively being focused on. User is paying attention and taking action.
      dormant:
        description: Concern is not actively focused on but has not been closed. May resume activity in
          the future without reopening.
      closed:
        description: Concern is no longer active and has been formally closed. May be archived or deleted
          depending on application layer.
  ConcernEntityRoleEnum:
    description: 'Semantic roles describing how an entity participates in a concern. IMPORTANT: These
      are semantic descriptors of involvement, NOT RBAC roles. Access control is an application-layer
      responsibility. (T-5 decision, Phase 3)'
    permissible_values:
      owner:
        description: 'The entity is responsible for the concern. Semantic: "who is driving this" (not
          "who can access").'
      target_person:
        description: 'The entity benefits from or is affected by the concern''s outcome. Semantic: "who
          does this concern affect".'
      collaborator:
        description: 'The entity works together with the concern owner on the focus. Semantic: "who is
          working with me on this".'
      coach:
        description: 'The entity provides coaching or guidance on the concern. Semantic: "who is coaching
          me".'
      mentor:
        description: 'The entity provides mentoring or advice on the concern. Semantic: "who is mentoring
          me".'
      stakeholder:
        description: 'The entity is affected by the outcome of the concern. Semantic: "who is impacted
          by this".'
      dependent:
        description: 'The entity depends on the outcome of the concern. Semantic: "who depends on this
          happening".'
      other:
        description: Unspecified or custom role not covered by above.
  SeverityEnum:
    description: Severity scale for problems and conditions
    permissible_values:
      LOW:
        description: Low impact severity
      MEDIUM:
        description: Medium impact severity
      HIGH:
        description: High impact severity
      CRITICAL:
        description: Critical impact severity (immediate action required)
  ProblemStatusEnum:
    description: Resolution status progression for problems
    permissible_values:
      IDENTIFIED:
        description: Problem has been identified
      ANALYZED:
        description: Problem has been analyzed for root causes
      ADDRESSING:
        description: Problem is being actively addressed
      RESOLVED:
        description: Problem has been resolved
      ACCEPTED:
        description: Problem has been accepted as ongoing (for struggles)
  RiskImpactEnum:
    description: Impact severity scale for risks
    permissible_values:
      MINIMAL:
        description: Minimal impact if risk materializes
      MINOR:
        description: Minor impact if risk materializes
      MODERATE:
        description: Moderate impact if risk materializes
      SEVERE:
        description: Severe impact if risk materializes
      CATASTROPHIC:
        description: Catastrophic impact if risk materializes
  LikelihoodTrendEnum:
    description: Trend direction for risk likelihood
    permissible_values:
      DECREASING:
        description: Likelihood is decreasing over time
      STABLE:
        description: Likelihood remains stable
      INCREASING:
        description: Likelihood is increasing over time
  TimeHorizonEnum:
    description: Time horizons for aspirational statements (Vision, etc.)
    permissible_values:
      5_years:
        description: 5-year horizon
      10_years:
        description: 10-year horizon
      lifetime:
        description: Lifetime horizon
      open_ended:
        description: Open-ended, no fixed horizon
  MonitoringFrequencyEnum:
    description: Frequency for risk monitoring and assessment
    permissible_values:
      DAILY:
        description: Monitor daily
      WEEKLY:
        description: Monitor weekly
      MONTHLY:
        description: Monitor monthly (default)
      QUARTERLY:
        description: Monitor quarterly
      YEARLY:
        description: Monitor yearly
  ConditionTypeEnum:
    description: Category of condition
    permissible_values:
      HEALTH:
        description: Physical or mental health condition
      ENVIRONMENTAL:
        description: Environmental or external condition
      SYSTEM:
        description: Technical, organizational, or social system condition
      SOCIAL:
        description: Social or relationship-based condition
      FINANCIAL:
        description: Financial or economic condition
      OTHER:
        description: Other condition type not categorized above
  ConditionDurationEnum:
    description: Time character of a condition
    permissible_values:
      TEMPORARY:
        description: Temporary condition (expected to resolve)
      CHRONIC:
        description: Chronic condition (long-lasting, ongoing management)
      PERMANENT:
        description: Permanent condition (unlikely to resolve)
  SystemTypeEnum:
    description: Category of system in a SystemCondition
    permissible_values:
      TECHNICAL:
        description: Technical or IT system
      ORGANIZATIONAL:
        description: Organizational or institutional system
      SOCIAL:
        description: Social or community system
      FINANCIAL:
        description: Financial or economic system
      LEGAL:
        description: Legal or regulatory system
  ThreatLevelEnum:
    description: Inherent danger level of a hazard
    permissible_values:
      LOW:
        description: Low threat level
      MEDIUM:
        description: Medium threat level
      HIGH:
        description: High threat level
      EXTREME:
        description: Extreme threat level (severe danger)
  ExposureFrequencyEnum:
    description: Frequency of exposure to a hazard
    permissible_values:
      RARE:
        description: Rarely exposed
      OCCASIONAL:
        description: Occasionally exposed
      FREQUENT:
        description: Frequently exposed
      CONSTANT:
        description: Constantly exposed
  ReadinessLevelEnum:
    description: Proficiency or readiness level for a capability
    permissible_values:
      UNPREPARED:
        description: Not prepared; significant gaps
      DEVELOPING:
        description: Developing capability; some proficiency
      READY:
        description: Ready to apply capability at baseline level
      PROFICIENT:
        description: Proficient application
      EXPERT:
        description: Expert-level capability
  EdgeRoleEnum:
    description: Enumeration of semantic relationship types between topics. Defines the specific nature
      of the directed relationship from parent to child.
    permissible_values:
      broader:
        description: Parent is broader/more general; child is narrower. Standard SKOS broader relationship
          indicating hierarchical generalization.
      narrower:
        description: Child is narrower/more specific; parent is broader. Standard SKOS narrower relationship
          indicating hierarchical specialization.
      part_of:
        description: Child is a part, component, or constituent of the parent. Indicates partitive/mereological
          relationship.
      instance_of:
        description: Child is an instance or example of the parent concept. Indicates instantiation relationship.
      related:
        description: Topics are related but not hierarchical. Standard SKOS related relationship for non-hierarchical
          semantic association.
  MatchTypeEnum:
    description: Enumeration of alignment match types between local Topics and external ontologies. Directly
      aligned with SKOS matching vocabulary.
    permissible_values:
      exact_match:
        description: Semantically equivalent concepts (SKOS exactMatch). The local topic and external
          concept refer to the same thing.
      close_match:
        description: Similar but not identical concepts (SKOS closeMatch). High similarity but with minor
          semantic differences.
      broad_match:
        description: External concept is broader (SKOS broadMatch). The external concept is more general
          than the local topic.
      narrow_match:
        description: External concept is narrower (SKOS narrowMatch). The external concept is more specific
          than the local topic.
      related_match:
        description: Related but not hierarchical (SKOS relatedMatch). The concepts are associated but
          without clear hierarchical relationship.
  EntityTypeEnum:
    description: Enumeration of entity types that can be aligned to external systems in Match records.
    permissible_values:
      topic:
        description: Alignment is for a Topic entity.
      taxonomy:
        description: Alignment is for a TopicTaxonomy entity.
  EffortStatusEnum:
    description: States in the strategic commitment lifecycle
    permissible_values:
      proposed:
        description: Effort has been proposed but not yet committed
      committed:
        description: Effort is formally committed
      active:
        description: Effort is actively in progress
      paused:
        description: Effort is temporarily paused
      completed:
        description: Effort has been completed
      retired:
        description: Effort is no longer active (archived)
  ActivityStatusEnum:
    description: States in the operational work lifecycle
    permissible_values:
      draft:
        description: Activity is in draft state, not yet started
      active:
        description: Activity is actively in progress
      paused:
        description: Activity is temporarily paused
      completed:
        description: Activity has been completed
      abandoned:
        description: Activity has been abandoned
  ActivityTypeEnum:
    description: 'Runtime discriminator values for Activity types. This is a base enum of canonical types;
      applications may extend with custom types at runtime. The activity_type slot uses string range with
      designates_type: true for runtime flexibility.'
    permissible_values:
      project:
        description: Deliverable-focused activity with defined scope
      experiment:
        description: Time-boxed trial with measurable criteria
      research:
        description: Investigation to inform future decisions
      study:
        description: Directed learning activity
      thinking:
        description: Pure introspection or reflection
  RelationshipTypeEnum:
    description: Enumeration of relationship types between World entities. Working set of 9 core values;
      formal finalization deferred to Phase 2.
    permissible_values:
      family:
        description: Family relationship (sibling, parent, child, spouse, relative)
      friend:
        description: Friendship relationship
      colleague:
        description: Work colleague or professional associate
      mentor:
        description: Mentor relationship (guidance and development)
      coach:
        description: Coach relationship (skill development and performance)
      collaborator:
        description: Active collaboration partner (working together on projects)
      acquaintance:
        description: Acquaintance or casual relationship
      professional:
        description: Professional relationship (no personal dimension)
      romantic:
        description: Romantic or intimate relationship
  RelationshipStatusEnum:
    description: Enumeration of relationship lifecycle states.
    permissible_values:
      active:
        description: Currently active and engaged relationship
      dormant:
        description: Inactive but potentially restorable relationship
      ended:
        description: Permanently ended relationship
      paused:
        description: Temporarily paused relationship
      evolving:
        description: Relationship in transition (changing type or status)
  NoteTypeEnum:
    title: Note Type
    description: Classification of note types for Note.note_type discriminator
    permissible_values:
      Note:
        description: General note
      Log:
        description: Temporal log entry
      Thought:
        description: Captured thought or insight
      Idea:
        description: Idea for future development
      Reference:
        description: Reference material or snippet
      Highlight:
        description: Extracted highlight or quote
  DocumentTypeEnum:
    title: Document Type
    description: Functional classification of documents for Document.document_type discriminator
    permissible_values:
      Document:
        description: Formal structured document
      Journal:
        description: Curated journal entry
      List:
        description: Structured list (reading list, bibliography, inventory)
      Notebook:
        description: Learning or reference notebook
      Logbook:
        description: Decision log or decision record
      Inventory:
        description: Catalog/inventory of things
      Landscape:
        description: State-of-field or landscape analysis
  RepositoryTypeEnum:
    title: Repository Type
    description: System classification for Repository entities
    permissible_values:
      local:
        description: Local file system or application
      cloud:
        description: Cloud-hosted service
      hybrid:
        description: Hybrid cloud and local
      distributed:
        description: Distributed/peer system
      version_control:
        description: Version control system (Git, etc.)
  ResourceStatusEnum:
    title: Resource Status
    description: Lifecycle state of a resource
    permissible_values:
      draft:
        description: Draft state, not finalized
      active:
        description: Active and in use
      archived:
        description: Archived but preserved
      deprecated:
        description: Deprecated, superseded
      merged:
        description: Merged into another resource
  RoleEnum:
    title: Qualified Link Role
    description: Semantic role in qualified relationships
    permissible_values:
      primary_subject:
        description: Primary subject classification
      keyword_mention:
        description: Incidental mention
      background:
        description: Background context
      evidence:
        description: Evidence or source material
      reference:
        description: Referenced resource
      requirement:
        description: Required for activity
      uses:
        description: Activity uses this resource
      produces:
        description: Activity produces this resource
  AnnotationTypeEnum:
    description: Enumeration of assertion types annotations can make about their targets. topic_classification
      and entity_linking carry well-defined value types; summary, keyphrase, sentiment, and concern_linking
      value ranges deferred.
    permissible_values:
      topic_classification:
        description: 'Classification asserting that target is classified under or related to a Topic/Concept.
          Value: value_concept (required). Typical confidence 0.6–0.95.'
      entity_linking:
        description: 'Linking asserting that target mentions, relates to, or references an Entity. Value:
          value_entity (required). Typical confidence 0.5–0.9.'
      summary:
        description: 'Summarization asserting a free-text summary of the target. Value: unspecified string
          (deferred formalization). Typical confidence 0.4–0.8.'
      keyphrase:
        description: 'Keyphrase extraction asserting a notable phrase or term from the target. Value:
          unspecified string or list (deferred formalization). Typical confidence 0.5–0.9.'
      sentiment:
        description: 'Sentiment classification asserting emotional or evaluative tone of the target. Value:
          unspecified enum/string (deferred formalization). Typical confidence 0.4–0.85.'
      concern_linking:
        description: 'Linking asserting that target relates to or supports a Concern''s focus. Value:
          value_concept routing to focus_concepts (proxy pattern). Typical confidence 0.5–0.9.'
  AnnotationStatusEnum:
    description: Three-state lifecycle for annotations. Transitions are explicit (no automatic progression).
      Rejected annotations are retained for audit trail; no reactivation of rejected status.
    permissible_values:
      proposed:
        description: Initial state; annotation not yet reviewed or confirmed
      accepted:
        description: Assertion has been confirmed by human or authoritative system
      rejected:
        description: Assertion has been explicitly marked incorrect or irrelevant; terminal state
classes:
  QualifiedLink:
    abstract: true
    description: Abstract base class for first-class relationships carrying semantic metadata in addition
      to source and target. Specialized qualified link classes (ResourceTopicLink, EffortActivityLink,
      etc.) extend this pattern across the ontology.
    slots:
    - id
    - created_by
    - created_at
    slot_usage:
      id:
        required: true
      created_at:
        range: datetime
        required: false
        description: Timestamp when this qualified link was created
    comments:
    - Not directly instantiated; use domain-specific subclasses
    - Carries: role, confidence, provenance beyond simple relationships
    - Enables rich relationship semantics across all domains
  Entity:
    abstract: true
    description: The logical root abstraction for all things that have identity in the ontology. An Entity
      is anything that can be named, tracked through time, and related to other things. All domain classes
      inherit from Entity. Not directly instantiated.
    class_uri: lifeos:Entity
    slots:
    - id
    - title
    - description
    - dateCreated
    - dateModified
    - url
    slot_usage:
      id:
        required: true
        description: Canonical logical identifier for this entity
      title:
        required: false
        description: Human-readable display name (required per domain via slot_usage)
      description:
        required: false
        description: Optional enrichment metadata
      dateCreated:
        required: false
        description: Creation timestamp
      dateModified:
        required: false
        description: Most recent modification timestamp
      url:
        required: false
        description: Optional external web address
    comments:
    - Abstract base class; not directly instantiated
    - All domain classes inherit from Entity
    - Establishes contract for persistent, referenceable things
    - Distinct from resources (storage), from events, from state changes
  Concern:
    description: 'A user-specific, ongoing focus of attention that can be associated with resources, concepts,
      and entities to provide personal context and organizational structure.

      A Concern does not represent identity (that''s Self), work execution (that''s Work), or knowledge
      structure (that''s Information); instead, it binds other entities together under a shared focus.

      Concerns operate as an OVERLAY LAYER, independent of deeper domains. A user may be concerned about
      something without it being part of their identity or formal work.'
    is_a: Entity
    class_uri: lifeos:Concern
    attributes:
      title:
        description: User-facing name of the concern
        required: true
      description:
        description: Why this is a current concern; context and motivation
      concern_type:
        description: 'Type of concern (discriminator). Values: project, goal, area, routine, learning,
          log, custom'
        required: true
      concern_status:
        description: Current state (active, dormant, closed)
        required: true
      concern_start:
        description: When the concern was initiated
      concern_target_date:
        description: Target or expected completion date (optional; most relevant for projects, goals,
          learning)
      parent_concern:
        description: Parent concern for hierarchical nesting. Single parent (v1); multi-parent via ConcernEdge
          deferred.
        range: Concern
      tags:
        description: User-applied labels or keywords
        range: string
        multivalued: true
      meta:
        description: Extension point for additional metadata (JSON)
        range: json
      created_at:
        description: Timestamp when concern was created
        range: datetime
        required: true
      updated_at:
        description: Timestamp of most recent update
        range: datetime
        required: true
  ProjectConcern:
    description: 'A Concern representing a concrete project with defined scope, resources, timeline, and
      expected outcome. A project is something you work on, with a beginning and an end.

      Distinct from Work::Project (execution structure) or Self::Goal (enduring aspiration). A ProjectConcern
      is a personal focus area that may or may not be formalized as work.'
    is_a: Concern
    class_uri: lifeos:ProjectConcern
  GoalConcern:
    description: 'A Concern representing a goal, target state, or objective that the user is working toward.
      A goal describes where you want to be, with a measurable or observable target condition.

      Distinct from Self::Goal (enduring aspiration). A GoalConcern is a time-limited focus ("run a 5K
      in under 25 minutes this month"); a Self::Goal is a long-term aspiration ("become a healthier person
      over my lifetime").'
    is_a: Concern
    class_uri: lifeos:GoalConcern
  AreaConcern:
    description: 'A Concern representing a broad area of life that the user is paying attention to. An
      area is a long-term, ongoing category of focus (e.g., Health, Career, Family, Finance).

      AreaConcerns are typically stable and can be hierarchical (Health → Fitness → Running). Distinct
      from Self::Role (identity-based) or Principle (value-based). An AreaConcern is "what I''m paying
      attention to in this domain right now".'
    is_a: Concern
    class_uri: lifeos:AreaConcern
  RoutineConcern:
    description: 'A Concern representing a recurring practice, habit, or regular commitment that the user
      maintains. A routine is something you do regularly (daily, weekly, etc.) to support your life or
      work.

      Captures the idea of an ongoing practice that is part of your current focus without being a project
      or a goal. Distinct from Self::Habit (stable behavioral pattern) or Work::Task (one-off execution).
      A RoutineConcern is "what I''m practicing right now".'
    is_a: Concern
    class_uri: lifeos:RoutineConcern
  LogConcern:
    description: 'A Concern representing an ongoing log, journal, or time-series tracking mechanism that
      the user maintains. A log is a structured record of data or observations over time, often supporting
      routine practices or goal tracking.

      Distinct from individual log entries (those are Resources) or the practice of logging (that''s RoutineConcern).
      A LogConcern is the ongoing system itself.'
    is_a: Concern
    class_uri: lifeos:LogConcern
  LearningConcern:
    description: 'A Concern representing a learning track, course, or skill development journey that the
      user is pursuing. A learning concern is a structured path toward acquiring knowledge or capability
      in a domain.

      Distinct from a GoalConcern (though learning may support a goal) or Self::Capability (the outcome).
      A LearningConcern is the learning journey itself.'
    is_a: Concern
    class_uri: lifeos:LearningConcern
  ResourceConcernLink:
    description: 'A first-class association linking a Resource (from Knowledge Management domain) to a
      Concern, capturing the role the resource plays in that concern and metadata about the association
      (confidence, provenance, creation timestamp).

      Implements the "qualified link" pattern: relationships are not merely edges but entities with their
      own properties. Enables rich provenance-aware associations.

      Example: A "Meals Log" document linked to a health area concern with role="canonical_logbook" and
      confidence=0.95.'
    attributes:
      resource_id:
        description: ID (CURIE) of the resource
        range: uriorcurie
        required: true
      concern_id:
        description: ID (CURIE) of the concern
        range: uriorcurie
        required: true
      resource_concern_role:
        description: 'Semantic role of the resource in the concern. Values: canonical_logbook (primary
          record), supporting_log (secondary record), reference (background material), evidence (supports
          claims), summary (progress), inspiration (guides direction), plan (execution plan), todo_list
          (task list), other'
        range: string
      link_confidence:
        description: Confidence score (0.0–1.0) that the resource-concern association is correct. 0.5
          = uncertain; 1.0 = highly confident.
        range: double
        minimum_value: 0.0
        maximum_value: 1.0
      link_created_by:
        description: 'Who created this link (user, system, ML model). Format: "user:alice", "system:import",
          "llm:claude"'
        range: string
      link_created_at:
        description: When the link was created
        range: datetime
  ConcernConceptLink:
    description: 'A first-class association linking a Concept/Topic (from Information domain) to a Concern,
      capturing the role the concept plays in that concern and metadata about the association.

      Enables concerns to express what they are about (themes), what they measure (metrics), what constrains
      them (constraints), and what risks they face (risk factors).

      Example: A health area concern linked to "Nutrition" concept with role="primary_theme" and confidence=0.9.'
    attributes:
      concern_id:
        description: ID (CURIE) of the concern
        range: uriorcurie
        required: true
      concept_id:
        description: ID (CURIE) of the concept/topic
        range: uriorcurie
        required: true
      concern_concept_role:
        description: 'Semantic role of the concept in the concern. Values: primary_theme (main topic),
          secondary_theme (supporting topic), metric (what is measured), constraint (what limits it),
          risk_factor (what risk), background_context (contextual knowledge), other'
        range: string
      link_confidence:
        description: Confidence score (0.0–1.0) that the concept-concern association is correct.
        range: double
        minimum_value: 0.0
        maximum_value: 1.0
      link_created_by:
        description: Who created this link (user, system, ML model).
        range: string
      link_created_at:
        description: When the link was created
        range: datetime
  ConcernEntityLink:
    description: 'A first-class polymorphic association linking an Entity (from World/Self domain) to
      a Concern, capturing the role that entity plays in that concern and metadata about the association.

      Enables concerns to express who is involved: owners (responsible), collaborators (work together),
      coaches/mentors (guidance), stakeholders (affected), targets (benefit).

      IMPORTANT: Roles are semantic descriptors of participation, NOT RBAC (access control). Access control
      belongs in application layer. (T-5 decision, Phase 3)

      Example: A project concern with entity="john_smith" role="owner" and confidence=1.0.'
    attributes:
      concern_id:
        description: ID (CURIE) of the concern
        range: uriorcurie
        required: true
      target_entity_uri:
        description: URI/CURIE identifier of the target entity (polymorphic across domains). Must include
          domain prefix for type safety (e.g., "self:person/alice", "world:organization/acme", "facts:person/bob").
        range: uriorcurie
        required: true
      concern_entity_role:
        description: 'Semantic role of the entity in the concern (NOT RBAC). Values: owner (responsible),
          target_person (benefits/affected), collaborator (works with), coach (provides coaching), mentor
          (provides mentoring), stakeholder (affected by outcome), dependent (depends on outcome), other'
        range: ConcernEntityRoleEnum
      link_confidence:
        description: Confidence score (0.0–1.0) that the entity-concern association is correct.
        range: double
        minimum_value: 0.0
        maximum_value: 1.0
      link_created_by:
        description: Who created this link (user, system, ML model).
        range: string
      link_created_at:
        description: When the link was created
        range: datetime
  Problem:
    description: A factual difficulty or undesired state that needs to be addressed or resolved, requiring
      attention from Work (Task) or Self (Behavior) domains. Problems are present or chronic adversities
      that affect Self.Organism, Work Projects, or World Assets. Problems form the umbrella for Struggle,
      Worry, and Emergency subtypes.
    is_a: Entity
    abstract: true
    attributes:
      title:
        description: Name or label for the problem
        required: true
      description:
        description: What is the problem and why it matters?
        required: false
      severity:
        description: Impact severity scale (LOW, MEDIUM, HIGH, CRITICAL)
        required: true
      impact_areas:
        description: What domains or entities are affected
        multivalued: true
        required: false
      root_causes:
        description: Why the problem exists
        multivalued: true
        required: false
      symptoms:
        description: Observable effects
        multivalued: true
        required: false
      discovered_date:
        description: When problem became known
        required: false
      resolution_status:
        description: Current state (IDENTIFIED, ANALYZED, ADDRESSING, RESOLVED, ACCEPTED)
        required: false
      resolution_plan:
        description: How to address or mitigate
        multivalued: true
        required: false
      related_problems:
        description: Related Problem entities
        multivalued: true
        required: false
      related_risks:
        description: Related Risk entities
        multivalued: true
        required: false
  Struggle:
    description: A chronic, persistent Problem that has persisted over an extended period and for which
      complete resolution may be unlikely. Struggles are managed rather than solved and become part of
      the operating landscape.
    is_a: Problem
    attributes:
      duration:
        description: How long this has been a struggle
        required: false
      coping_strategies:
        description: Current ways of managing
        multivalued: true
        required: false
      acceptance_level:
        description: How much you've accepted this struggle (0.0–1.0)
        required: false
  Worry:
    description: A Problem framed as anxiety about a potential future that may or may not materialize,
      distinct from Risk (formal assessment) or concrete Problems (present-state). Worries are emotionally
      charged concerns that may be well-founded or amplified.
    is_a: Problem
    attributes:
      anxiety_level:
        description: Intensity of worry (0.0–1.0)
        required: false
      likelihood:
        description: Estimated probability of the feared outcome (0.0–1.0)
        required: false
      worst_case_scenario:
        description: What you fear might happen
        required: false
      mitigation_available:
        description: Can you do something about it?
        required: false
  Emergency:
    description: A Problem requiring immediate action with a defined deadline and known consequences of
      inaction. Emergencies suspend normal planning and prioritization and represent crisis-level situations.
    is_a: Problem
    attributes:
      deadline:
        description: When this must be resolved by
        required: true
      consequences_if_unresolved:
        description: What happens if not resolved in time
        multivalued: true
        required: false
      immediate_actions:
        description: What must be done right now
        multivalued: true
        required: false
      resources_needed:
        description: What is required to resolve
        multivalued: true
        required: false
  Risk:
    description: A formal assessment of a potential future Problem, characterized by estimated probability,
      potential impact, and contributing Hazards. Risks are independent entities distinct from their materialization;
      risk management involves ongoing assessment and monitoring regardless of whether a current Problem
      exists.
    is_a: Entity
    attributes:
      title:
        description: Name or label for the risk
        required: true
      description:
        description: What could happen?
        required: false
      probability:
        description: Likelihood of occurrence (0.0–1.0)
        required: true
      impact:
        description: Severity if materialized (MINIMAL, MINOR, MODERATE, SEVERE, CATASTROPHIC)
        required: true
      likelihood_trend:
        description: Direction of change (DECREASING, STABLE, INCREASING)
        required: false
      time_horizon:
        description: When it might occur (IMMEDIATE, SHORT_TERM, MEDIUM_TERM, LONG_TERM)
        required: true
      mitigation_strategies:
        description: Ways to prevent or reduce impact
        multivalued: true
        required: false
      monitoring_frequency:
        description: How often to assess
        required: false
      last_assessed:
        description: When risk was last reviewed
        required: false
      early_warning_signs:
        description: Indicators risk is materializing
        multivalued: true
        required: false
      related_problems:
        description: Related Problem entities
        multivalued: true
        required: false
  Condition:
    description: An intrinsic, ongoing state or circumstance affecting an entity (Organism, Asset, Location)
      that is neither inherently bad nor good but constrains or enables action. Conditions are distinct
      from Problems in that they are states, not difficulties. Forms the umbrella for HealthCondition,
      EnvironmentalCondition, and SystemCondition subtypes.
    is_a: Entity
    abstract: true
    attributes:
      title:
        description: Name or label for the condition
        required: true
      description:
        description: What is the state?
        required: false
      condition_type:
        description: Category (HEALTH, ENVIRONMENTAL, SYSTEM, SOCIAL, FINANCIAL, OTHER)
        required: true
      severity:
        description: Impact magnitude (MILD, MODERATE, SEVERE)
        required: false
      condition_duration:
        description: Time character (TEMPORARY, CHRONIC, PERMANENT)
        required: true
      onset_date:
        description: When this condition began
        required: false
      affecting_entity:
        description: What entity does this condition affect
        required: false
      management_approach:
        description: How you're adapting/managing
        multivalued: true
        required: false
      related_problems:
        description: Related Problem entities
        multivalued: true
        required: false
  HealthCondition:
    description: A physical or mental health Condition affecting the Organism, with optional explicit
      medical properties (diagnosis, treatment, healthcare provider, prognosis). Supports both clinically-diagnosed
      and self-identified health conditions.
    is_a: Condition
    attributes:
      diagnosis:
        description: Medical diagnosis or clinical name (optional)
        required: false
      treatment_plan:
        description: Recommended or current treatments
        multivalued: true
        required: false
      healthcare_provider:
        description: URI/CURIE reference to healthcare provider
        required: false
      medications:
        description: Current medications
        multivalued: true
        required: false
      prognosis:
        description: Expected trajectory
        required: false
  EnvironmentalCondition:
    description: A Condition in the physical or digital environment (not internal to an entity) that affects
      operations or experience. Environmental conditions have specific properties around location and
      controllability.
    is_a: Condition
    attributes:
      location:
        description: Where does this condition exist
        required: false
      controllable:
        description: Can you change this condition? (default false)
        required: false
      adaptation_required:
        description: How must you adapt?
        multivalued: true
        required: false
  SystemCondition:
    description: A Condition affecting technical, organizational, social, financial, or legal systems
      you depend on. System conditions require systemic rather than personal response and have specific
      properties around workarounds.
    is_a: Condition
    attributes:
      system_name:
        description: Name of the system affected
        required: true
      system_type:
        description: Category (TECHNICAL, ORGANIZATIONAL, SOCIAL, FINANCIAL, LEGAL)
        required: true
      workarounds:
        description: Ways to work despite this condition
        multivalued: true
        required: false
  Hazard:
    description: A dangerous entity, substance, or condition that poses a risk of harm if encountered
      or activated. Hazards are distinct from Problems and Conditions; they exist as potential sources
      of harm independent of whether harm has occurred. Risk assessment begins with identifying hazards.
    is_a: Entity
    attributes:
      title:
        description: Name or label for the hazard
        required: true
      description:
        description: What is the hazard?
        required: false
      threat_level:
        description: Inherent danger level (LOW, MEDIUM, HIGH, EXTREME)
        required: true
      exposure_likelihood:
        description: Likelihood of encountering this hazard (0.0–1.0)
        required: false
      exposure_frequency:
        description: How often exposed (RARE, OCCASIONAL, FREQUENT, CONSTANT)
        required: false
      preventive_measures:
        description: Ways to avoid exposure
        multivalued: true
        required: false
      protective_measures:
        description: Ways to protect if exposed
        multivalued: true
        required: false
      related_risks:
        description: Risks that this hazard contributes to
        multivalued: true
        required: false
  Capability:
    description: 'An assessment of abilities and limitations of an entity (Organism, Asset, Community),
      including current readiness, gaps, and development plans. Capabilities model what can be done, what
      cannot be done, and how to develop gaps. Dual nature: both an assessed state and a developable outcome.'
    is_a: Entity
    attributes:
      title:
        description: Name or label for the capability
        required: true
      description:
        description: What is this capability about?
        required: false
      entity_reference:
        description: URI/CURIE of entity having this capability
        required: false
      abilities:
        description: Things that can be done (with proficiency info)
        multivalued: true
        required: false
      limitations:
        description: Things that cannot be done (with type and permanence)
        multivalued: true
        required: false
      readiness_level:
        description: Overall preparedness (UNPREPARED, DEVELOPING, READY, PROFICIENT, EXPERT)
        required: false
      gaps:
        description: Missing capabilities needed
        multivalued: true
        required: false
      development_plan:
        description: How to develop missing capabilities
        multivalued: true
        required: false
      related_conditions:
        description: Conditions that limit this capability
        multivalued: true
        required: false
  Effectiveness:
    description: A measurement of how well an entity (Organism, Asset, System, Behavior) is functioning
      relative to its potential and current conditions. Distinct from Capabilities (which measure potential),
      Effectiveness measures actual functioning. Used for monitoring, bottleneck identification, and improvement
      planning.
    is_a: Entity
    attributes:
      title:
        description: Name or label for what's being assessed
        required: true
      description:
        description: What is being measured?
        required: false
      entity_reference:
        description: URI/CURIE of entity being assessed
        required: false
      capacity_score:
        description: Potential/theoretical capacity (0.0–1.0)
        required: true
      condition_score:
        description: Current condition/health (0.0–1.0)
        required: true
      overall_rating:
        description: Combined effectiveness score (0.0–1.0)
        required: true
      bottlenecks:
        description: What's limiting effectiveness
        multivalued: true
        required: false
      improvement_opportunities:
        description: Ways to increase effectiveness
        multivalued: true
        required: false
      assessment_date:
        description: When was this assessed?
        required: true
      related_conditions:
        description: Conditions affecting this effectiveness
        multivalued: true
        required: false
      related_problems:
        description: Problems affecting this effectiveness
        multivalued: true
        required: false
  TopicTaxonomy:
    class_uri: skos:ConceptScheme
    description: A named grouping scheme that contains a set of related topics. It is analogous to a SKOS
      ConceptScheme. A taxonomy serves as the container within which all topics are organized and classified.
      Every Topic must belong to exactly one TopicTaxonomy.
    slots:
    - id
    - title
    - description
    - created_by
    - created_on
    - last_updated_on
  Topic:
    class_uri: skos:Concept
    description: A focused concept or subject within a TopicTaxonomy. It represents a discrete idea, category,
      or area of focus that can be used to classify and tag resources, activities, and other entities.
      Topics form a polyhierarchical graph (multiple parents allowed) within their parent taxonomy.
    slots:
    - id
    - taxonomy_id
    - title
    - slug
    - description
    - aliases
    - materialized_path
    - created_by
    - created_on
    - last_updated_on
    - has_parent_topics
    - has_child_topics
  TopicEdge:
    description: A directed relationship between two topics, representing a specific semantic connection
      type (e.g., "broader", "narrower", "part_of", "instance_of", "related"). Edges form the semantic
      backbone of the topic hierarchy.
    slots:
    - id
    - parent_id
    - child_id
    - edge_role
    - created_on
    - created_by
  TopicClosure:
    description: A pre-computed transitive closure of the topic hierarchy. It records all ancestor-descendant
      pairs and the depth (distance) between them. This enables efficient queries like "find all ancestors
      of topic X". A performance optimization that has ontological significance by making explicit which
      topics are transitively related.
    slots:
    - id
    - ancestor_id
    - descendant_id
    - depth
  Match:
    description: A first-class entity recording the alignment of a local Topic or TopicTaxonomy to a concept
      in an external ontology system. It carries confidence score, provenance information, and evidence
      notes. Enables rich semantic alignment with external systems like Wikidata, CSO, LCSH, MeSH, UNSPSC,
      Schema.org, DBpedia, etc.
    slots:
    - id
    - entity_type
    - entity_id
    - external_system
    - external_id
    - match_type
    - confidence
    - evidence
    - created_on
    - created_by
  Organism:
    description: A single person — the central individual using the Life OS system. Represents the physical
      embodiment and agency of a human being, grounding the entire ontology.
    class_uri: foaf:Agent
    slots:
    - id
    - name
    - givenName
    - familyName
    - mbox
    - birthday
    - topic_interest
    - has_identity
    - has_values
    - has_principles
    - has_behaviors
    - has_vision
    - has_goals
    slot_usage:
      id:
        required: true
      name:
        required: true
        description: Full name of the organism
    comments:
    - Central individual managing their life using Life OS
    - Extends FOAF Agent for semantic web interoperability
    - Root entity with no Self container wrapper
    - All relationships flow outbound from Organism
  Identity:
    description: The constellation of roles, archetypes, and areas of importance that define "who I am"
      or "who I aspire to be." Conceptual grouping treating multifaceted nature of personhood. Currently
      no formal class; Roles and Archetypes link directly to Organism.
    abstract: true
    comments:
    - CANDIDATE: Conceptual grouping, not yet formalized as class
    - Roles and Archetypes currently link directly to Organism
    - Formalization pending implementation use cases
    - Marked for future enhancement when Identity modeling is needed
    slots:
    - id
    - title
    - description
  Role:
    description: A societal role that is important to your identity, or an example of an individual you
      aspire to be like. Enduring identity position distinct from temporary job assignments.
    class_uri: lifeos:Role
    slots:
    - id
    - title
    - description
    slot_usage:
      id:
        required: true
      title:
        required: true
        description: Role name (e.g., Engineer, Father, Learner, Craftsperson). Should be enduring, not
          specific/temporary assignments.
    comments:
    - Represents enduring identity positions
    - Examples: Engineer, Father, Learner, Craftsperson
    - Anti-example - Software Developer on Payment Systems Team (too specific)
  Archetype:
    description: A pattern, ideal, or exemplar that you aspire to embody — often a composite of traits,
      a historical figure, or a philosophical position.
    class_uri: lifeos:Archetype
    slots:
    - id
    - title
    - description
    slot_usage:
      id:
        required: true
      title:
        required: true
        description: Archetype name (e.g., The Stoic, Marcus Aurelius, The Craftsperson). Should be aspirational
          pattern, not functional role.
    comments:
    - CANDIDATE: Promising conceptual addition
    - Represents aspirational patterns, not concrete positions
    - Examples: The Stoic, Marcus Aurelius, The Contemplative
    - Anti-example - Software Engineer (too specific/functional)
    - Distinct from Value (which is principle) and Vision (which is outcome)
  Value:
    description: A principle or priority that guides decisions and shapes how you live — a core belief
      about what matters. Enduring commitment distinct from temporary objectives or behavioral patterns.
    class_uri: lifeos:Value
    slots:
    - id
    - title
    - description
    slot_usage:
      id:
        required: true
      title:
        required: true
        description: Value name (e.g., Autonomy, Learning, Integrity, Connection, Contribution). Should
          be enduring commitment, not time-bound.
    comments:
    - Examples: Autonomy, Learning, Integrity, Connection, Contribution
    - Anti-example: Finish quarterly OKRs (that is Goal, not Value)
    - Distinct from Principle (rule derived from it)
    - Distinct from Goal (which is time-bound)
  Principle:
    description: A guiding statement or rule derived from your alignment (values and identity) that governs
      how you behave and make decisions. Concrete rule from abstract commitment.
    class_uri: lifeos:Principle
    slots:
    - id
    - title
    - description
    slot_usage:
      id:
        required: true
      title:
        required: true
        description: Principle statement (e.g., "I make decisions aligned with my core values"). Should
          be actionable rule, not abstract commitment.
    comments:
    - Examples: I make decisions aligned with my values, not external pressure
    - Examples: I invest time in learning every week
    - Examples: I keep commitments I make to others
    - Distinct from Value (which is commitment, not rule)
    - Distinct from Behavior (which is enactment, not rule)
  Behavior:
    abstract: true
    description: Any physical manifestation, action, or pattern that you enact to live in alignment with
      your principles — ranging from deliberate techniques to deeply habituated automatic responses. Treated
      as spectrum from conscious to automatic, though categories are not mutually exclusive.
    class_uri: lifeos:Behavior
    slots:
    - id
    - title
    - description
    - enacts_principle
    - implements_goal
    slot_usage:
      id:
        required: true
      title:
        required: true
    comments:
    - Spectrum: Method (conscious) → Process (sequence) → Routine (recurrence) → Habit (automatic)
    - Not strict hierarchy; same behavior can be categorized multiple ways
    - Examples: Morning review routine, Active listening practice, Value-aligned project decline
  Method:
    is_a: Behavior
    description: A specific technique or manner in which you accomplish a type of task or goal — applied
      consciously and deliberately at the conscious-application end of the behavior spectrum.
    class_uri: lifeos:Method
    comments:
    - Examples: Pomodoro Technique, Socratic method, Getting Things Done (GTD)
    - Emphasis on conscious, deliberate application
    - Distinct from Process (sequence focus), Routine (regularity focus), Habit (automaticity focus)
  Process:
    is_a: Behavior
    description: A sequence of steps or techniques that you follow — a structured approach to accomplishing
      something, representing the sequential-organization end of the behavior spectrum.
    class_uri: lifeos:Process
    comments:
    - Examples: Code review process, Learning process (skim/read/practice/teach/reflect)
    - Examples: Decision process (gather info/consider values/sleep on it/decide)
    - Emphasis on structured sequencing
  Routine:
    is_a: Behavior
    description: A sequence of steps that you take regularly — a behavior pattern that recurs at predictable
      intervals (daily, weekly, etc.), at the regular-recurrence end of the spectrum. Consciously maintained
      regularity.
    class_uri: lifeos:Routine
    slots:
    - id
    - title
    - description
    - enacts_principle
    - implements_goal
    - recurrence_pattern
    - estimated_time
    slot_usage:
      recurrence_pattern:
        description: When does this routine occur? (e.g., "Daily at 7 AM", "Sunday evening")
        range: string
      estimated_time:
        description: Estimated duration (e.g., "15 minutes", "1 hour")
        range: string
    comments:
    - Examples: Morning review (15 min daily at 7 AM)
    - Examples: Weekly planning (Sunday evening, 1 hour)
    - Examples: Quarterly reflection (first day of quarter)
    - Emphasis on conscious, regular recurrence (distinct from Habit's automaticity)
  Habit:
    is_a: Behavior
    description: A habituated sequence of steps or response that occurs regularly and automatically, with
      minimal conscious effort. At the automaticity end of the behavior spectrum.
    class_uri: lifeos:Habit
    slots:
    - id
    - title
    - description
    - enacts_principle
    - implements_goal
    - trigger
    - automated
    slot_usage:
      trigger:
        description: What triggers this habit? (e.g., "Before bed", "First thing in morning")
        range: string
      automated:
        description: Confirmed automatic? Boolean flag indicating if habit is fully automated.
        range: boolean
    comments:
    - Examples: Brushing teeth before bed
    - Examples: Checking Slack first thing in the morning
    - Examples: Saying "thank you" to people
    - Emphasis on automaticity and minimal conscious effort
    - Distinct from Routine (which maintains conscious attention)
  Vision:
    description: A set of high-level, long-term future-state assertions about who you want to become or
      what you want to create — the aspirational frame for your evolution. Open-ended or multi-decade
      horizon.
    class_uri: lifeos:Vision
    slots:
    - id
    - title
    - description
    - time_horizon
    slot_usage:
      id:
        required: true
      title:
        required: true
        description: Vision statement (e.g., "Build systems that amplify human agency").
      time_horizon:
        description: Approximate time horizon for this vision (5_years, 10_years, lifetime, open_ended)
        range: TimeHorizonEnum
    comments:
    - Examples: Build systems that amplify human agency
    - Examples: Become a wise mentor to the next generation
    - Examples: Create a life of autonomy, learning, and connection
    - Anti-example: Complete the project by June (that is Goal, not Vision)
    - Distinct from Goal (which is time-bound and measurable)
    - Distinct from Value (which is principle)
  Goal:
    description: A low-level, time-bound statement of some change or outcome you want to achieve, specified
      in measurable terms and aligned with one or more Visions. Concrete objective within defined timeframe.
    class_uri: lifeos:Goal
    slots:
    - id
    - title
    - description
    - aligned_with_vision
    - target_date
    - measurable_criteria
    - has_deltas
    slot_usage:
      id:
        required: true
      title:
        required: true
      aligned_with_vision:
        description: One or more Visions this Goal advances toward
        range: Vision
        multivalued: true
        required: false
      target_date:
        description: Target completion date
        range: date
      measurable_criteria:
        description: How will you know this goal is achieved? (should be specific and measurable)
        range: string
    comments:
    - Examples: Achieve principal engineer level by 2028
    - Examples: Learn 3 new programming languages this year
    - Examples: Strengthen relationships through weekly family time
    - Anti-example: Execute tasks on the project roadmap (Work domain)
    - Distinct from Vision (which is directional, not time-bound)
    - Distinct from Value (which is principle)
  Delta:
    abstract: true
    description: Any specific, individual change or transformation that is desired — representing a gap
      between current state and desired state in a particular dimension. Parent class for Outcome and
      Action.
    class_uri: lifeos:Delta
    slots:
    - id
    - title
    - description
    slot_usage:
      id:
        required: true
      title:
        required: true
    comments:
    - Abstract parent for specific, desired changes
    - Operationalizes Goals into concrete deltas
    - Specializes as Outcome (target state) or Action (behavioral change)
  Outcome:
    is_a: Delta
    description: A type of Delta that describes a target state or condition you want to achieve or maintain
      — representing desired end states.
    class_uri: lifeos:Outcome
    comments:
    - Examples: Shift from reactive to proactive in my work
    - Examples: Have a clear weekly plan
    - Examples: Maintain regular communication with my mentor
    - Distinct from Action (which is behavioral change)
    - Distinct from Goal (which is broader objective)
  Action:
    is_a: Delta
    description: A type of Delta that describes doing something differently — a behavioral change or practice
      you want to enact, representing desired behavioral shifts.
    class_uri: lifeos:Action
    comments:
    - Examples: Start a daily review practice
    - Examples: Say no to projects that don't align with values
    - Examples: Practice active listening in conversations
    - Distinct from Outcome (which is target state)
    - Distinct from Routine (which is enacted behavior, not desired change)
    - Distinct from Task (which is Work domain)
  Effort:
    description: A strategic commitment—the decision to invest energy in a direction over time. Sits between
      aspiration (Goal, in Self domain) and concrete action (Activity), framing and organizing work rather
      than being the work itself.
    is_a: Entity
    class_uri: dbo:Work
    attributes:
      title:
        description: Short name for the effort
        required: true
      description:
        description: Strategic framing and rationale
      status:
        description: Current state (proposed, committed, active, paused, completed, retired)
        required: true
      start_date: null
      target_date: null
      parent_effort: null
      tags:
        description: User-applied labels
        range: string
        multivalued: true
      meta:
        description: Extension point for additional metadata
        range: json
      created_at:
        description: Timestamp when effort was created
        range: datetime
        required: true
      updated_at:
        description: Timestamp of most recent update
        range: datetime
        required: true
  Activity:
    description: A concrete, traceable unit of user-directed work requiring focus, time, or energy. Defined
      at runtime by activity_type discriminator (project, experiment, research, study, thinking, or custom)
      rather than fixed class hierarchy. Primary instantiable unit in the Work domain.
    is_a: Entity
    attributes:
      title:
        description: Short name for the activity
        required: true
      description:
        description: Extended description of the activity
      activity_type:
        description: Runtime discriminator (project, experiment, research, study, thinking, custom)
        required: true
      status:
        description: Current state (draft, active, paused, completed, abandoned)
        range: ActivityStatusEnum
        required: true
      start_date:
        description: Intended or actual start date
      due_date:
        description: Target completion date
      parent_activity:
        description: Parent activity for hierarchical nesting
      tags:
        description: User-applied labels
        range: string
        multivalued: true
      meta:
        description: Extension point for additional metadata
        range: json
      created_at:
        description: Timestamp when activity was created
        range: datetime
        required: true
      updated_at:
        description: Timestamp of most recent update
        range: datetime
        required: true
  EffortActivityLink:
    description: Qualified link from an Effort to an Activity, indicating organizational, strategic, or
      causal relationship. Carries role, confidence, and provenance metadata. Enables many-to-many relationship
      between Efforts and Activities.
    attributes:
      effort_id:
        description: ID of the effort being linked
        range: uriorcurie
        required: true
      activity_id:
        description: ID of the activity being linked
        range: uriorcurie
        required: true
      relationship_type:
        description: Type of relationship (organizes, supports, incubates, explores_for)
        range: string
      role:
        description: Role of activity in effort (primary, supporting, context)
        range: string
      confidence:
        description: Confidence score for the link (0.0–1.0)
        range: double
        minimum_value: 0.0
        maximum_value: 1.0
      provenance:
        description: Provenance metadata (JSON)
        range: json
      creator:
        description: User or system that created the link
        range: string
      created_at:
        description: Timestamp when the link was created
        range: datetime
      created_on:
        description: Date when the link was created
        range: date
  GoalEffortLink:
    description: Qualified link from a Goal (Self domain) to an Effort, indicating that the Effort implements
      or advances the Goal. Forward reference; Goal class defined in Self domain.
    attributes:
      goal_id:
        description: ID of the goal (Self domain)
        range: uriorcurie
        required: true
      effort_id:
        description: ID of the effort (Work domain)
        range: uriorcurie
        required: true
      relationship_type:
        description: Type of relationship (implemented_by, advances, supports)
        range: string
      role:
        description: Role of effort in goal implementation (primary, supporting, exploratory)
        range: string
      confidence:
        description: Confidence score for the link (0.0–1.0)
        range: double
        minimum_value: 0.0
        maximum_value: 1.0
      provenance:
        description: Provenance metadata (JSON)
        range: json
      creator:
        description: User or system that created the link
        range: string
      created_at:
        description: Timestamp when the link was created
        range: datetime
  ActivityTopicLink:
    description: Qualified link from an Activity to a Topic (Information domain), indicating that the
      work is about, informed by, or aligned with the topic. Forward reference; Topic class defined in
      Information domain.
    attributes:
      activity_id:
        description: ID of the activity (Work domain)
        range: uriorcurie
        required: true
      topic_id:
        description: ID of the topic (Information domain)
        range: uriorcurie
        required: true
      relationship_type:
        description: Type of relationship (about, informed_by, aligned_with)
        range: string
      role:
        description: Role of topic (primary_focus, supporting_context, research_area)
        range: string
      confidence:
        description: Confidence score for the link (0.0–1.0)
        range: double
        minimum_value: 0.0
        maximum_value: 1.0
      provenance:
        description: Provenance metadata (JSON)
        range: json
      creator:
        description: User or system that created the link
        range: string
      created_at:
        description: Timestamp when the link was created
        range: datetime
  EffortTopicLink:
    description: Qualified link from an Effort to a Topic (Information domain), indicating that strategic
      work is aligned with or organized around topical domains. Forward reference; Topic class defined
      in Information domain.
    attributes:
      effort_id:
        description: ID of the effort (Work domain)
        range: uriorcurie
        required: true
      topic_id:
        description: ID of the topic (Information domain)
        range: uriorcurie
        required: true
      relationship_type:
        description: Type of relationship (aligned_with, organized_by, contextualizes)
        range: string
      role:
        description: Role of topic (primary_domain, supporting_context)
        range: string
      confidence:
        description: Confidence score for the link (0.0–1.0)
        range: double
        minimum_value: 0.0
        maximum_value: 1.0
      provenance:
        description: Provenance metadata (JSON)
        range: json
      creator:
        description: User or system that created the link
        range: string
      created_at:
        description: Timestamp when the link was created
        range: datetime
  ActivityResourceLink:
    description: Qualified link from an Activity to a Resource (Knowledge Management domain), indicating
      that the work uses, produces, or references the resource. Forward reference; Resource class defined
      in KM domain.
    attributes:
      activity_id:
        description: ID of the activity (Work domain)
        range: uriorcurie
        required: true
      resource_id:
        description: ID of the resource (KM domain)
        range: uriorcurie
        required: true
      relationship_type:
        description: Type of relationship (uses, produces, references)
        range: string
      role:
        description: Role of resource (primary_source, supporting_reference, evidence, requirement, background)
        range: string
      confidence:
        description: Confidence score for the link (0.0–1.0)
        range: double
        minimum_value: 0.0
        maximum_value: 1.0
      provenance:
        description: Provenance metadata (JSON)
        range: json
      creator:
        description: User or system that created the link
        range: string
      created_at:
        description: Timestamp when the link was created
        range: datetime
  EffortResourceLink:
    description: Qualified link from an Effort to a Resource (Knowledge Management domain), indicating
      that strategic work spans resources as inputs or outputs. Forward reference; Resource class defined
      in KM domain.
    attributes:
      effort_id:
        description: ID of the effort (Work domain)
        range: uriorcurie
        required: true
      resource_id:
        description: ID of the resource (KM domain)
        range: uriorcurie
        required: true
      relationship_type:
        description: Type of relationship (uses, produces, references)
        range: string
      role:
        description: Role of resource (primary_input, supporting_resource, output, evidence)
        range: string
      confidence:
        description: Confidence score for the link (0.0–1.0)
        range: double
        minimum_value: 0.0
        maximum_value: 1.0
      provenance:
        description: Provenance metadata (JSON)
        range: json
      creator:
        description: User or system that created the link
        range: string
      created_at:
        description: Timestamp when the link was created
        range: datetime
  Object:
    abstract: true
    description: An abstract representation of any thing that exists in the world with definable boundaries
      and persistent identity. Objects are the base class for anything physical or digital that the organism
      might interact with, own, use, or depend on.
    is_a: Entity
    class_uri: schema:Thing
    attributes:
      title:
        description: Name or label for the object
        required: true
      description:
        description: What the object is and its purpose
  PhysicalObject:
    description: 'A subtype of Object representing things that have material, spatial, and temporal existence.
      Physical objects occupy space, have mass or substance, and persist or decay in the physical world.
      Examples: laptop, car, house, tool, furniture, book (physical artifact).'
    is_a: Object
    class_uri: schema:Product
  DigitalObject:
    description: 'A subtype of Object representing things that exist as information or computation artifacts.
      Digital objects exist as data, code, or computational states within digital systems and do not have
      physical substance except as electronic memory. Examples: file, application, web service, API, library,
      database, account, cloud service.'
    is_a: Object
    class_uri: schema:DigitalDocument
  Asset:
    description: 'A representation of an Object (physical or digital) that the organism actively uses,
      depends on, manages, or owns. An Asset tracks the organism''s relationship to an Object: how it
      is used, how long it has been in use, and its value or criticality. Semantically a "possessive use
      relationship" reified as an entity, enabling lifecycle tracking and dependency modeling. Inherits
      from Object for schema simplicity while representing a relationship layer between organism and world.'
    is_a: Object
    class_uri: schema:Product
    attributes:
      title:
        description: Name of the asset (human-friendly name, may differ from Object title)
        required: true
      description:
        description: Why this asset matters or what role it plays
      uses_object:
        description: Reference to the Object this Asset represents
        required: true
      has_usage:
        description: Description of how this asset is used
      has_age:
        description: Duration of use (in application-specific units)
  Person:
    description: An individual human being in the external World domain, distinct from Organism (Self
      domain) who is the central subject of the ontology. A Person has identity, agency, and the capacity
      to interact with the organism, participate in work, and form relationships. Promoted to carry_forward
      status in Phase 3 World domain boundary work.
    is_a: Object
    class_uri: schema:Person
    attributes:
      title:
        description: Name of the person
        required: true
      description:
        description: Who this person is, their role, or context
      contact_info:
        description: Email, phone, or other contact information
        multivalued: true
  Relationship:
    description: A first-class entity modeling a bond, interaction pattern, or ongoing connection between
      the organism and one or more Persons, or between Persons. A Relationship captures the quality, type,
      history, and nature of interpersonal bonds. Enables sophisticated social modeling, community detection,
      and collaboration planning. Promoted to carry_forward status in Phase 3 World domain boundary work.
    is_a: Object
    class_uri: schema:Thing
    attributes:
      title:
        description: Label or name for the relationship (e.g., "Alice (colleague)" or "Bob (close friend)")
      description:
        description: Additional context or meaning about the relationship
      relationship_type:
        description: Type of relationship (friend, colleague, mentor, family, etc.)
        required: true
      involves_person:
        description: The Person(s) involved in this relationship
        required: true
        multivalued: true
      since_date:
        description: When this relationship began
      relationship_status:
        description: Current lifecycle state of the relationship
      context_or_meaning:
        description: Context in which the relationship originated or operates
  Community:
    description: An organized or coherent group of Persons who share identity, purpose, or ongoing interaction.
      A Community is a higher-order social structure composed of Persons and the Relationships between
      them. Enables modeling of teams, families, communities of practice, hobby groups, organizations,
      and any organized group. Promoted to carry_forward status in Phase 3 World domain boundary work.
    is_a: Object
    class_uri: schema:Organization
    attributes:
      title:
        description: Name of the community (e.g., "My Team," "Hiking Club," "Family")
        required: true
      description:
        description: What the community is about or why it exists
      member_list:
        description: Persons who are members of this community
        multivalued: true
      founded_date:
        description: When the community was established
      community_purpose:
        description: The explicit purpose, mission, or shared goal of the community
  Resource:
    title: Resource
    description: Abstract base class for any information artifact that can be stored, retrieved, and organized.
      Logical ontology concept, distinct from storage implementation. Resources are fundamental to knowledge
      management and provide unified abstraction enabling cross-system querying.
    abstract: true
    class_uri: lifeos:Resource
    slots:
    - id
    - title
    - description
    - location
    - content_location
    - format
    - media_type
    - resource_type
    - created_on
    - updated_on
    - creator
    - created_by
    - source_system
    - ingestion_method
    - ingestion_confidence
    - sync_status
    - last_sync
    - is_in_repository
    - is_in_collection
    - is_in_catalog
    - relates_to_topic
    - has_use
    - has_purpose
    - references_resource
    - is_referenced_by
    - derives_from
    - is_source_for
    - elaborates
    - is_elaborated_by
    - contradicts
    - is_contradicted_by
    - supersedes
    - is_superseded_by
    - relates_to
    slot_usage:
      id:
        required: true
      title:
        required: false
        description: Human-readable title (required per subtype)
      is_in_repository:
        required: true
        description: Every resource must exist in a repository
  Note:
    title: Note
    description: Resource representing small, incrementally captured information typically authored by
      self with minimal structure. Notes expected to evolve into Documents, be merged, archived, or deprecated.
      Captures knowledge at the ingestion end of the spectrum.
    is_a: Resource
    class_uri: lifeos:Note
    slots:
    - note_type
    slot_usage:
      note_type:
        description: Type of note for discrimination
  Document:
    title: Document
    description: Resource representing structured, intentional artifacts typically authored or heavily
      synthesized, at the archival and reference layer. Enables preservation guarantees, structured navigation,
      publication workflows.
    is_a: Resource
    class_uri: foaf:Document
    slots:
    - document_type
    slot_usage:
      title:
        required: true
        description: Documents must have titles
      document_type:
        description: Functional document type
  Bookmark:
    title: Bookmark
    description: Resource representing reference to external URL (web page, article, video) collected
      without downloading content. Typically from browser tools or reading services. URL-based identity
      with external site as canonical location.
    is_a: Resource
    class_uri: lifeos:Bookmark
    slots:
    - favicon_url
    slot_usage:
      location:
        required: true
        description: External URL is required for bookmarks
  Highlight:
    title: Highlight
    description: Resource representing passage or excerpt extracted from another Resource. Preserves quoted
      text, source context, and optional annotations. Enables passage-level indexing and provenance tracking.
    is_a: Resource
    class_uri: lifeos:Highlight
    slots:
    - has_source_resource
    - source_passage_text
    - source_location
    slot_usage:
      has_source_resource:
        required: true
        description: Source resource is required for highlights
  Collection:
    title: Collection
    description: Resource grouping other Resources for organizational convenience and thematic coherence.
      Simpler than Catalog with focus on informal containment without governance structure.
    is_a: Resource
    class_uri: lifeos:Collection
    slots:
    - has_resources
  Catalog:
    title: Catalog
    description: Resource representing curated, governed collection of related Resources using DCAT semantics.
      Enables typed relationships, formal curation, semantic clarity, and interoperability.
    is_a: Resource
    class_uri: dcat:Catalog
    slots:
    - themes
    - has_resources
  Repository:
    title: Repository
    description: 'First-class entity representing a system or application storing and managing resources.
      Examples: Obsidian vault, Safari bookmarks, Zotero, Raindrop, GitHub, file system, Heptabase, Readwise.
      Captures provenance, system-specific metadata, and cross-system queries.'
    class_uri: lifeos:Repository
    slots:
    - id
    - title
    - description
    - service_name
    - repository_type
    - created_on
    - updated_on
    - web_url
    slot_usage:
      id:
        required: true
      title:
        required: true
      service_name:
        required: true
        description: Application name (Obsidian, Safari, Zotero, etc.)
  ResourceTopicLink:
    title: Resource-Topic Link
    description: Qualified link from a Resource to a Topic carrying role, confidence, and provenance metadata.
      Formally expresses resource subject classification with semantic richness beyond simple tagging.
    class_uri: lifeos:ResourceTopicLink
    slots:
    - id
    - source_resource
    - target_topic
    - role
    - confidence
    - provenance
    - creator
    - created_on
    slot_usage:
      id:
        required: true
      source_resource:
        required: true
      target_topic:
        required: true
      confidence:
        range: double
        minimum_value: 0.0
        maximum_value: 1.0
  ResourceActivityLink:
    title: Resource-Activity Link
    description: Qualified link from a Resource to an Activity carrying role, confidence, and provenance.
      Formalizes work support relationships (uses, produces, references) with semantic metadata.
    class_uri: lifeos:ResourceActivityLink
    slots:
    - id
    - source_resource
    - target_activity
    - role
    - confidence
    - provenance
    - creator
    - created_on
    slot_usage:
      id:
        required: true
      source_resource:
        required: true
      target_activity:
        required: true
      role:
        description: uses, produces, references, evidence, requirement, background
      confidence:
        range: double
        minimum_value: 0.0
        maximum_value: 1.0
  Annotation:
    description: A provisional or confirmed assertion made by an automated system or human about a resource,
      entity, or concept. Carries target, value, confidence score, and explicit lifecycle state, enabling
      incremental knowledge enrichment with provenance tracking. Serves as optional first-class extension
      layer above core ontology.
    is_a: Entity
    attributes:
      title:
        description: Optional label for the annotation
        range: string
      uri:
        description: Explicit RDF IRI if different from id
      target:
        description: The target being annotated (Resource, Entity, or Concept URI/CURIE)
        required: true
      annotation_type:
        description: Kind of assertion
        required: true
      value_concept:
        description: Concept value (used for topic_classification, concern_linking)
      value_entity:
        description: Entity value (used for entity_linking)
      confidence:
        description: Confidence score (0.0–1.0); default 0.5 if unset
      status:
        description: Lifecycle state
        required: true
      created_by:
        description: Agent identifier with qualified prefix
        required: true
      created_at:
        description: Creation timestamp
        required: true
      meta:
        description: Extension point for additional metadata
        range: json
imports:
- linkml:types
