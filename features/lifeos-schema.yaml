id: https://lifeos.org/schema/lifeos
mixins:
  Provenance:
    description: Optional mixin for tracking creator attribution, modification history, and audit trail.
      Use when entities need creator tracking and provenance documentation.
    slots:
    - created_by
    - modified_by
    - provenance_notes
    comments:
    - Optional; entities don't inherit by default
    - Specific domains (Knowledge Management, Annotations) may require it
    - Provides accountability and source tracking
  Lifecycle:
    description: Optional mixin for lifecycle state management, deprecation tracking, and entity merging.
      Use when entities have status changes or merge events.
    slots:
    - status
    - deprecated_at
    - merged_into
    comments:
    - Optional; applies to entities with lifecycle events
    - status enums are domain-specific
    - Supports entity consolidation and archival
  Temporal:
    description: Optional mixin for time-bounded validity windows. Use when entity information is only
      valid during specific time periods.
    slots:
    - valid_from
    - valid_until
    comments:
    - Optional; for temporal scoping of metadata
    - Distinct from creation/modification dates
    - Supports temporal reasoning and temporal databases
  Trackable:
    description: Optional mixin for cross-system synchronization and external reference tracking. Use
      when entities participate in multi-repository integration.
    slots:
    - external_ids
    - sync_status
    - last_synced_at
    - version
    - change_reason
    comments:
    - Optional; applies to entities synced across systems
    - Enables federation and multi-repository ontology use
    - Reduces coupling between systems
  Measurable:
    description: Optional mixin for measurement-driven entities with metrics, targets, and current values.
      Use for Goals, Capabilities, and other measurable outcomes.
    slots:
    - metric
    - target_value
    - current_value
    - unit
    - measurement_timestamp
    comments:
    - Optional; applies to entities with quantifiable aspects
    - Flexible value types support different metric kinds
    - Measurement tracking enables progress monitoring
